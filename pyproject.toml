[project]
name = "wanderlust"
version = "0.0.1"
description = "An agentic trip planner grounded in Wikivoyage travel guides."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sundus Aijaz" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "rich>=13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/sundusaijaz/wanderlust"
Issues = "https://github.com/sundusaijaz/wanderlust/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanderlust"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
wanderlust = "wanderlust.cli:app"
